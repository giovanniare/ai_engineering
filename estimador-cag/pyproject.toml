[project]
name = "estimador-cag"
version = "0.1.0"
description = "Sesion 2: Ejercicio"
readme = "README.md"
authors = [
    { name = "Giovanni Arellano", email = "giovanniare9525@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.5.0",
    "fastapi[standard]>=0.141.1",
    "openai>=3.14.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
